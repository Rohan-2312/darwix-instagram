<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Darwix Content Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=Inter:wght@500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: the design team's console. Full-width page, white header with tabs, 14px-radius hairline cards, one indigo accent, Manrope + Inter pills + JetBrains Mono for times. */
:root{
  --bg:#F5F4FB; --surface:#FFFFFF; --sunken:#F1F0F9; --tint:#EEEFFF; --track:#EDEEF6;
  --ink:#141416; --ink2:#515153; --ink3:#686868; --ink4:#8A92A8; --label:#6B7185;
  --line:#E8E7F3; --line2:#DBDBDC; --line3:#C5CADF; --hair:#F1F1F1; --hair2:#F8F8F8; --strong:#949395;
  --brand:#565ADD; --brand-ink:#4344B8; --brand-hover:#4F4FE8; --on-brand:#FFFFFF;
  --ok:#17AA2E; --err:#D93A3A;
  --rev-bg:#FFF5DB; --rev-fg:#7A5300; --rev-dot:#C98A00;
  --ok-bg:#E7F6EA; --ok-fg:#0F6A1D;
  --sch-bg:#EEEFFF; --sch-fg:#4344B8; --sch-dot:#565ADD;
  --pub-bg:#F1F1F1; --pub-fg:#494848; --pln-bg:#EDEEF6; --pln-fg:#6B7185;
  --fail-bg:#FCEBEB; --fail-fg:#A82828; --ban-bg:#FDF3F3; --ban-line:#F3CFCF;
  --shadow:0 1px 2px rgba(14,19,48,.12); --shadow2:0 2px 8px rgba(14,19,48,.06); --lift:0 1px 2px rgba(40,40,110,.05),0 10px 28px -14px rgba(60,60,150,.20); --disp:"Bricolage Grotesque",Manrope,system-ui,sans-serif;
  color-scheme:light;
  --font:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif; --pill:Inter,Manrope,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink2);font:400 13.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.i{display:inline-block;flex:0 0 auto;background:currentColor;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat}
.i.ig{background:radial-gradient(circle at 30% 107%,#FDF497 0%,#FDF497 5%,#FD5949 45%,#D6249F 60%,#285AEB 90%)}
.hd{background:var(--surface);border-bottom:1px solid var(--line);padding:20px 32px 0;display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.crumbs{display:flex;align-items:center;gap:8px;font:500 12.5px var(--font);color:var(--ink3)}
.crumbs .sl{color:var(--line3)}.crumbs b{color:var(--ink2);font-weight:600}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font:700 28px/38px var(--font);letter-spacing:-.7px;color:var(--ink);text-wrap:balance}
.sub{margin:0;font:400 13.5px/21px var(--font);color:var(--ink3);text-wrap:pretty}
.sub b{color:var(--ink2);font-weight:600}
.hact{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:-1px;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;padding:10px 14px 12px;font:600 13.5px var(--font);white-space:nowrap;color:var(--ink3);background:none;border:0;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--brand-ink);border-bottom-color:var(--brand)}
.count{font:600 11px var(--mono);background:var(--rev-bg);color:var(--rev-fg);padding:2px 6px;border-radius:999px}
.page{padding:28px 32px 64px;display:flex;flex-direction:column;gap:24px;width:100%}
@media(max-width:700px){.hd{padding:16px 16px 0}.page{padding:20px 16px 56px}h1{font-size:24px;line-height:32px}}
/* buttons */
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font:600 13px var(--font);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hair2)}
.btn.lg{height:44px;padding:0 18px;font-size:14px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand);box-shadow:var(--shadow)}
.btn.pri:hover{background:var(--brand-hover)}
.btn.sm{height:32px;padding:0 10px;border-radius:8px;border-color:transparent;background:transparent;font-size:12.5px;gap:6px}
.btn.sm:hover{background:var(--sunken)}
.btn.sm.pri{background:var(--brand);padding:0 12px}.btn.sm.pri:hover{background:var(--brand-hover)}
.btn.sm.out{border-color:var(--strong);background:var(--surface)}
.btn.sm.tx,.btn.tx{color:var(--brand);border-color:transparent;background:transparent}
.btn.tx:hover{background:var(--tint)}
.btn.out{border-color:var(--strong)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ic{width:32px;padding:0}
/* cards */
.sec,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card.pad,.sec.pad{padding:24px}
.sec-h,.cardhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--hair)}
.sec-h h2,.cardhead h2{margin:0;font:700 15px var(--font);color:var(--ink)}
.sec-h small,.cardhead small{font:400 12px var(--font);color:var(--ink3)}
.sec-h .mono{font:500 12px var(--mono);color:var(--ink3)}
.sec-h .btn:last-child,.cardhead .btn:last-child,.cardhead .row:last-child{margin-left:auto}
.ri{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--hair2)}
.ri:last-child{border-bottom:0}
.ri .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ri .t1{font:600 13.5px var(--font);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .t2{font:400 12.5px var(--font);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb{width:32px;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.lb.s28{width:28px;height:28px;flex-basis:28px}
.lbl,.eyebrow{font:700 11.5px var(--font);letter-spacing:1.6px;text-transform:uppercase;color:var(--label)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:32px 18px;text-align:center;color:var(--ink3);font-size:12.5px}
.empty b{font:600 14px var(--font);color:var(--ink)}
.empty .ring{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.wrapflex{display:flex;gap:20px;flex-wrap:wrap;align-items:stretch}
.wrapflex>section{min-width:0}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font:600 11.5px var(--pill);white-space:nowrap;align-self:flex-start}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.s-review{background:var(--rev-bg);color:var(--rev-fg)}.s-review i{background:var(--rev-dot)}
.s-scheduled,.s-publishing{background:var(--sch-bg);color:var(--sch-fg)}.s-scheduled i,.s-publishing i{background:var(--sch-dot)}
.s-published{background:var(--pub-bg);color:var(--pub-fg)}
.s-failed{background:var(--fail-bg);color:var(--fail-fg)}.s-failed i{background:var(--err)}
.s-planned{background:var(--pln-bg);color:var(--pln-fg)}
.s-ok{background:var(--ok-bg);color:var(--ok-fg)}.s-ok i{background:var(--ok)}
.chip{align-self:flex-start;display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font:600 11.5px var(--pill);white-space:nowrap}
.q-high{background:var(--ok-bg);color:var(--ok-fg)}.q-med{background:var(--rev-bg);color:var(--rev-fg)}.q-low{background:var(--fail-bg);color:var(--fail-fg)}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font:500 13px var(--pill);background:var(--surface);color:var(--ink2);border:1px solid var(--line2);white-space:nowrap}
.fchip em{font:500 11.5px var(--mono);font-style:normal;color:var(--ink3)}
.fchip[aria-pressed=true]{background:var(--tint);color:var(--brand-ink);border-color:var(--line3)}
.fchip[aria-pressed=true] em{color:var(--brand-ink)}
.fgroup{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flab{font:700 10px var(--pill);letter-spacing:1.4px;text-transform:uppercase;color:var(--label);width:64px}
/* banners */
.banner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;border:1px solid}
.banner.err{background:var(--ban-bg);border-color:var(--ban-line)}
.banner.info{background:var(--tint);border-color:var(--line3)}
.banner .bt{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.banner b{font:700 14px var(--font);color:var(--ink)}
.banner span.m{font:400 13px var(--font);color:var(--ink2)}
/* journey */
.jgrid{display:grid;grid-template-columns:repeat(6,minmax(92px,1fr));min-width:600px}
.js{display:flex;flex-direction:column;gap:8px;min-width:0;padding-right:8px;background:none;border:0;text-align:left;font:inherit}
.js .rl{display:flex;align-items:center}
.ring{width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:flex;align-items:center;justify-content:center;font:700 12px var(--font);background:var(--surface);color:var(--ink4);border:1px solid var(--line3)}
.js.done .ring{background:var(--ok);color:#fff;border:none}
.js.cur .ring{color:var(--brand);border:2px solid var(--brand)}
.js.err .ring{background:var(--fail-bg);color:var(--err);border:2px solid var(--err)}
.hl{height:2px;flex:1;min-width:12px;margin:0 8px;border-radius:1px;background:var(--line)}
.js.done .hl{background:var(--ok)}
.js .lab{font:600 13.5px/20px var(--font);color:var(--ink)}.js.up .lab{font-weight:500;color:var(--ink3)}
.js .met{font:400 12px/18px var(--font);color:var(--ink3);overflow-wrap:anywhere}
.jbar{height:4px;border-radius:2px;background:var(--track);overflow:hidden;margin-right:12px}
.jbar>i{display:block;height:100%;background:var(--brand)}.js.err .jbar>i{background:var(--err)}.js.done .jbar>i{background:var(--ok)}
.pbar{width:220px;max-width:100%;height:6px;border-radius:3px;background:var(--track);overflow:hidden}.pbar>i{display:block;height:100%;background:var(--brand)}
.ntgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;border-top:1px solid var(--hair);padding-top:18px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:14px}
.wait{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wait button{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:var(--bg);border:0;text-align:left;min-width:0}
.wait button:hover{background:var(--sunken)}
.wait b{font:600 18px var(--mono);color:var(--ink)}.wait span.l{font:500 12px/16px var(--font);color:var(--ink2)}
.big{font:700 28px/38px var(--font);letter-spacing:-.7px;color:var(--ink)}
/* platform cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;text-align:left}
button.pc:hover{border-color:var(--line3);box-shadow:var(--shadow2)}
.pc.dim{opacity:.55}
.pc .ft{display:flex;align-items:center;gap:8px;font:400 12px var(--font);color:var(--ink3);border-top:1px solid var(--hair);padding-top:12px}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:var(--ok)}.dot.bad{background:var(--err)}.dot.off{background:var(--line3)}
.run{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--hair2)}
.run:last-child{border-bottom:0}
.led{width:8px;height:8px;border-radius:50%;flex:0 0 8px}.led.ok{background:var(--ok)}.led.bad{background:var(--err)}.led.run{background:var(--brand)}
/* posts */
.pgrid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;align-items:start}
.post{padding:18px;display:flex;flex-direction:column;gap:14px}
.post .cap{white-space:pre-wrap;color:var(--ink2);font-size:13.5px;line-height:21px;max-height:9.5em;overflow:hidden}
.post .cap .tg{color:var(--brand)}
.strip{display:flex;gap:8px;overflow-x:auto}
.strip img,.strip .ph{height:110px;aspect-ratio:4/5;border-radius:10px;border:1px solid var(--line);flex:0 0 auto;background:repeating-linear-gradient(135deg,var(--sunken) 0 6px,var(--track) 6px 12px)}
.ph{display:flex;align-items:flex-end;justify-content:center;padding:8px;font:400 10px var(--mono);color:var(--label)}
.post .ft{display:flex;align-items:center;gap:6px;border-top:1px solid var(--hair);padding-top:12px;flex-wrap:wrap}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font:700 11.5px var(--font);letter-spacing:1.6px;text-transform:uppercase;color:var(--ink2)}
input[type=text],input[type=password],input[type=datetime-local],select{height:44px;width:100%;border:0;border-radius:12px;background:var(--sunken);padding:0 14px;font:400 13.5px var(--font);color:var(--ink2);text-transform:none;letter-spacing:0;outline:none}
textarea{width:100%;min-height:96px;resize:vertical;border:0;border-radius:12px;background:var(--sunken);padding:14px;font:400 13.5px/21px var(--font);color:var(--ink2);text-transform:none;letter-spacing:0;outline:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:2px}
select{width:auto;height:36px;padding:0 10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form .full{grid-column:1/-1}
@media(max-width:700px){.form{grid-template-columns:1fr}}
.hint{font:400 12.5px/19px var(--font);color:var(--ink3);letter-spacing:0;text-transform:none}
.stack{display:flex;flex-direction:column;gap:24px}
.secb{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.stepper{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:600 13px var(--font);color:var(--ink3)}
.stepper .ring{width:24px;height:24px;flex-basis:24px;font-size:11px}
.stepper .on{color:var(--ink)}.stepper .hl{max-width:80px;margin:0}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .dh{padding:10px 8px;font:700 11px var(--font);letter-spacing:1.4px;color:var(--label);border-bottom:1px solid var(--hair);background:var(--bg)}
.cal .day{min-height:108px;padding:8px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--surface);min-width:0}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--bg)}
.cal .day .n{font:500 12px var(--mono);color:var(--ink3)}
.cal .day.today .n{color:#fff;background:var(--brand);border-radius:999px;align-self:flex-start;padding:1px 7px}
.ev{display:flex;gap:6px;align-items:center;min-width:0;padding:4px 6px;border-radius:6px;font:500 11.5px var(--font);border:0;text-align:left;width:100%}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:700px){.cal .day{min-height:72px;padding:4px}.ev{font-size:10px}}
/* pipeline counters */
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.pipe .sec{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.pipe b{font:600 22px var(--mono);color:var(--ink)}.pipe span{font:500 12px var(--font);color:var(--ink3);display:flex;gap:6px;align-items:center}
/* insights */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.kpi b{font:700 28px/36px var(--font);letter-spacing:-.7px;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font:700 11px var(--font);letter-spacing:1.4px;text-transform:uppercase;color:var(--label);padding:10px 18px;border-bottom:1px solid var(--hair);background:var(--bg)}
.tbl td{padding:12px 18px;border-bottom:1px solid var(--hair2);color:var(--ink2)}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:12px;height:150px;padding:8px 18px 14px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bars i{display:block;width:100%;max-width:56px;background:var(--brand);border-radius:6px 6px 0 0;min-height:3px}
.bars span{font:500 11px var(--mono);color:var(--ink3)}.bars em{font:600 12px var(--mono);font-style:normal;color:var(--ink)}
.mode{display:inline-flex;align-items:center;gap:6px;height:28px;border-radius:999px;padding:0 12px;font:600 12px var(--pill)}
.mode.live{background:var(--ok-bg);color:var(--ok-fg)}.mode.demo{background:var(--rev-bg);color:var(--rev-fg)}
.mode::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.5);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(1100px,100%);height:100%;overflow:auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;flex-wrap:wrap}
.dbody{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:24px;padding:24px}
@media(max-width:900px){.dbody{grid-template-columns:1fr}}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow2)}
.phone .ph2{display:flex;align-items:center;gap:10px;padding:10px 12px}
.avatar{width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:0 0 32px}
.avatar img{width:20px;height:20px}
.phone canvas{width:100%;aspect-ratio:4/5;display:block;background:#fff}
.dots{display:flex;gap:4px;justify-content:center;padding:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line2)}.dots i.on{background:var(--brand)}
.phone .pcap{padding:4px 12px 14px;font-size:13px;white-space:pre-wrap;color:var(--ink2);max-height:170px;overflow:auto}
.slc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.slc.on{border-color:var(--brand);background:var(--tint)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font:600 13px var(--font);z-index:90;box-shadow:var(--shadow2);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}

/* ===== Studio polish: soft paper, rounder shapes, one hero moment ===== */
body{background:var(--bg)}
.hd{background:rgba(255,255,255,.84);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);padding-bottom:12px;gap:14px;border-bottom-color:var(--line)}
h1,.big,.kpi b,.sec-h h2,.pipe b,.hh{font-family:var(--disp)}
h1{font-weight:700;letter-spacing:-1px}
.tabs{gap:4px;margin-bottom:0}
.tab{border-radius:999px;border:0;padding:8px 14px;transition:background .15s,color .15s}
.tab:hover{background:var(--sunken)}
.tab[aria-selected=true]{background:var(--tint);color:var(--brand-ink)}
.sec,.card{border-radius:22px;border-color:var(--line);box-shadow:var(--lift)}
.tile{border-radius:16px;background:var(--hair2)}
.pc{border-radius:20px;box-shadow:var(--lift);transition:transform .18s ease,box-shadow .18s ease,border-color .18s}

async function savePosts(msg){

    const f = await gh.getFile("schedule.json"); const remote = JSON.parse(f.text); S.sha = f.sha;

  }

}

function parseCells(txt){
  const t = String(txt||"").replace(/^﻿/,"").trim(); if (!t) return [];
  const first = t.split(/\r?\n/)[0], sep = first.includes("\t") ? "\t" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i=0; i<t.length; i++){ const ch = t[i];
    if (q){ if (ch === '"'){ if (t[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"' && cur === "") q = true;
    else if (ch === sep){ row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && t[i+1] === "\n") i++; row.push(cur); cur = ""; rows.push(row); row = []; }
    else cur += ch; }
  row.push(cur); rows.push(row);
  return rows.map(r => r.map(s => s.trim())).filter(r => r.some(Boolean));
}

  if ((m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ ,]+(\d{1,2}):(\d{2})/))) return new Date(`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}T${m[4].padStart(2,"0")}:${m[5]}:00+05:30`).toISOString();

}

function parseSheet(txt){

    return { pillar:r[0]||"", topic:r[1]||"", hook:r[2]||"", direction:r[3]||"", cta:r[4]||"", publish_at: parseWhen(r[5]), caption:(r[6]||"").replace(/\\n/g,"\n"), slides,

  });
}

function liChecks(p){

function makePdf(pages){ /* pages: [{bytes:Uint8Array(JPEG), w, h}] -> Blob */
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = b => { const u = typeof b === "string" ? enc.encode(b) : b; parts.push(u); len += u.length; };
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n${body}\nendobj\n`); };
  push("%PDF-1.4\n");
  const kids = pages.map((_, i) => `${3+3*i} 0 R`).join(" ");
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, `<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`);
  pages.forEach((pg, i) => {
    const w = pg.w/2, h = pg.h/2, pn = 3+3*i, cn = pn+1, im = pn+2, cs = `q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;
    obj(pn, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${cn} 0 R >>`);
    obj(cn, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[im] = len; push(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\nstream\n`); push(pg.bytes); push("\nendstream\nendobj\n");
  });
  const n = 3 + 3*pages.length, xr = len;
  push(`xref\n0 ${n}\n0000000000 65535 f \n` + offs.slice(1, n).map(o => String(o).padStart(10,"0") + " 00000 n \n").join(""));
  push(`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`);
  return new Blob(parts, { type:"application/pdf" });
}

function vCalendar(){
  const now = new Date(Date.now()+19800000);
  if (!S.calMonth) S.calMonth = { y:now.getUTCFullYear(), m:now.getUTCMonth() };
  const {y,m} = S.calMonth, first = new Date(Date.UTC(y,m,1)), lead = (first.getUTCDay()+6)%7, days = new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const cells = []; for (let i=0;i<lead;i++) cells.push(null); for (let d=1; d<=days; d++) cells.push(d); while (cells.length%7) cells.push(null);
  const flt = S.calFilter || "all";
  const evs = {}; S.posts.filter(p=>p.publish_at && (flt==="all" || stage(p)===flt || (flt==="scheduled"&&stage(p)==="publishing"))).forEach(p => { const t = istParts(p.publish_at); if (t.getUTCFullYear()===y && t.getUTCMonth()===m){ (evs[t.getUTCDate()] ||= []).push(p); } });
  const un = S.posts.filter(p => !p.publish_at && stage(p)!=="planned");
  return `<section class="sec"><div class="sec-h" style="flex-wrap:wrap;gap:12px"><h2 style="font-size:18px">${new Date(Date.UTC(y,m,1)).toLocaleString("en-IN",{month:"long",year:"numeric",timeZone:"UTC"})}</h2>
    <div class="row" style="gap:6px;margin-left:auto">${[["all","All"],["scheduled","Scheduled"],["published","Published"],["failed","Failed"]].map(([k,l])=>`<button class="fchip" style="height:28px;padding:0 10px;font:600 12px var(--font)" aria-pressed="${flt===k}" data-act="calf:${k}">${l}</button>`).join("")}<button class="btn sm out" data-act="cal:-1" aria-label="Previous month">${ico("chevron-left",14)}</button><button class="btn sm out" data-act="cal:0">Today</button><button class="btn sm out" data-act="cal:1" aria-label="Next month">${ico("chevron-right",14)}</button></div></div>
    <div class="cal">${["MON","TUE","WED","THU","FRI","SAT","SUN"].map(d=>`<div class="dh">${d}</div>`).join("")}${cells.map(d=>`<div class="day ${d?"":"out"} ${d&&y===now.getUTCFullYear()&&m===now.getUTCMonth()&&d===now.getUTCDate()?"today":""}">${d?`<span class="n">${d}</span>${(evs[d]||[]).map(p=>{const st=stage(p);return `<button class="ev s-${st}" data-act="open:${p.id}" title="${esc(p.meta?.topic||p.id)}"><span class="i ig" style="--u:url(${ICONS.instagram});width:12px;height:12px"></span><span>${esc(istParts(p.publish_at).toISOString().slice(11,16))} ${esc(p.meta?.topic||p.id)}</span></button>`}).join("")}`:""}</div>`).join("")}</div></section>
  <section class="sec"><div class="sec-h"><h2>Not yet scheduled</h2><small>${un.length} draft${un.length===1?"":"s"} waiting for a time</small></div>${un.length?un.map(reviewItem).join(""):`<div class="empty"><span class="ring" style="background:var(--ok-bg);color:var(--ok)">${ico("circle-check",22)}</span><b>Every draft has a time</b></div>`}</section>
  <section class="banner info"><span style="color:var(--brand);display:flex">${ico("refresh-cw",22)}</span><div class="bt"><b>Publishing automation</b><span class="m">GitHub Actions checks schedule.json every 15 minutes, publishes approved carousels that are due through the Instagram Graph API, then writes the result back here. Times are IST.</span></div><button class="btn out" data-act="runpub">${ico("send",14)}Check now</button></section>`;
}

async function paintPreview(){
  if (!S.drawer) return; const p = getPost(S.drawer.id); const cv = $("#prev"); if (!p || !cv) return;
  const slides = p.meta?.slides || []; if (!slides.length){ const c = cv.getContext("2d"); c.fillStyle="#F3F4FF"; c.fillRect(0,0,1080,1350); c.fillStyle="#8A90A6"; c.font="500 40px Manrope, sans-serif"; c.textAlign="center"; c.fillText("No slides yet", 540, 675); return; }
  const i = Math.min(S.drawer.slide||0, slides.length-1); await drawSlide(cv, slides[i], i, slides.length, p.meta.topic);
}
function pullDrawerInputs(){
  if (!S.drawer) return; const p = getPost(S.drawer.id); if (!p || stage(p)==="published") return; const slides = p.meta.slides||[];

}


/* ---------- effects: spotlight, parallax, tab indicator, count-up, confetti ---------- */
(function(){
  let raf = 0;
  document.addEventListener("mousemove", e => {
    if (raf) return; const t = e.target;
    raf = requestAnimationFrame(() => { raf = 0;
      const card = t.closest && t.closest(".sec,.pc,.post,.tile,.kpi");
      if (card){ const r = card.getBoundingClientRect(); card.style.setProperty("--sx", (e.clientX-r.left)+"px"); card.style.setProperty("--sy", (e.clientY-r.top)+"px"); }
      const hero = t.closest && t.closest(".hero");
      if (hero){ const r = hero.getBoundingClientRect(), fan = hero.querySelector(".fan"); if (fan){ fan.style.setProperty("--mx", ((e.clientX-r.left)/r.width*2-1).toFixed(3)); fan.style.setProperty("--my", ((e.clientY-r.top)/r.height*2-1).toFixed(3)); } }
    });
  }, {passive:true});
  document.addEventListener("mouseleave", () => { const f = document.querySelector(".fan"); if (f){ f.style.setProperty("--mx",0); f.style.setProperty("--my",0); } });
})();
function burst(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const cols = ["#565ADD","#8A8DF0","#FF9A6B","#C75BD6","#17AA2E","#FFD166"];
  for (let i=0;i<46;i++){ const d = document.createElement("i"); d.className = "cf"; const a = Math.random()*Math.PI*2, v = 160+Math.random()*320;
    d.style.cssText = `left:50%;top:42%;background:${cols[i%cols.length]};--dx:${Math.cos(a)*v}px;--dy:${Math.sin(a)*v-120+Math.random()*340}px;--rot:${Math.random()*900-450}deg;animation-delay:${Math.random()*80}ms`;
    document.body.appendChild(d); setTimeout(()=>d.remove(), 1600); }
}
function afterRender(){
  const nav = $(".tabs"); if (nav){
    let ind = nav.querySelector(".tabind"); const on = nav.querySelector('[aria-selected="true"]');
    if (on){ if (!ind){ ind = document.createElement("span"); ind.className = "tabind"; nav.prepend(ind); }
      const prev = S._ti; const set = () => { ind.style.left = on.offsetLeft+"px"; ind.style.width = on.offsetWidth+"px"; S._ti = {l:on.offsetLeft,w:on.offsetWidth}; };
      if (prev){ ind.style.transition = "none"; ind.style.left = prev.l+"px"; ind.style.width = prev.w+"px"; ind.offsetWidth; ind.style.transition = ""; requestAnimationFrame(set); } else set();
      nav.classList.add("ind"); }
  }
  if (S._enter){ S._enter = false; const pg = $(".page"); if (pg){ [...pg.children].forEach((c,i)=>c.style.setProperty("--i", Math.min(i,8))); pg.classList.add("enter"); setTimeout(()=>pg.classList.remove("enter"), 1400); }
    if (!matchMedia("(prefers-reduced-motion:reduce)").matches) document.querySelectorAll(".big,.wait b,.pipe b,.kpi b").forEach(el => { const m = /^(\d+)(%?)$/.exec(el.textContent.trim()); if (!m) return; const to = +m[1], suf = m[2], t0 = performance.now(); const tick = t => { const k = Math.min(1,(t-t0)/900), e = 1-Math.pow(1-k,3); el.textContent = Math.round(to*e)+suf; if (k<1) requestAnimationFrame(tick); }; el.textContent = "0"+suf; requestAnimationFrame(tick); });
  }
}

function render(){
  const b = byStage(), tabName = TABS.find(t=>t[0]===S.tab)[1];
  const view = { overview:vOverview, create:vCreate, posts:vPosts, linkedin:vLinkedIn, calendar:vCalendar, approvals:vApprovals, insights:vInsights, settings:vSettings }[S.tab]();
  const y = window.scrollY;
  $("#app").innerHTML = `<header class="hd"><div class="crumbs"><span>Darwix AI</span><span class="sl">/</span><b>Content Studio</b><span class="sl">/</span><span>${tabName}</span></div>
    <div class="hrow"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><h1>Content Studio</h1><p class="sub">Queue · <b>@darwixai</b> · ${S.posts.length} post${S.posts.length===1?"":"s"} · Instagram · LinkedIn ${S.li.length}</p></div>
    <div class="hact"><span class="mode ${live()?"live":"demo"}" title="${live()?"Connected to "+esc(S.cfg.owner+"/"+S.cfg.repo):"Showing sample data. Connect GitHub in Settings."}">${live()?"Live · "+esc(S.cfg.repo):"Sample data"}</span>
    <button class="btn" data-act="reload" ${S.loading?"disabled":""}>${ico("refresh-cw",14)}${S.loading?"Loading":"Refresh"}</button>
    <button class="btn" data-act="runpub">${ico("send",14)}GitHub publisher</button>
    <button class="btn pri lg" data-act="tab:create">${ico("plus",16)}Create carousel</button></div></div>
    <nav class="tabs" role="tablist">${TABS.map(t=>`<button class="tab" role="tab" aria-selected="${S.tab===t[0]}" data-act="tab:${t[0]}">${t[1]}${t[0]==="approvals"&&b.review.length?`<span class="count">${b.review.length}</span>`:""}</button>`).join("")}</nav></header>
    <div class="page">${S.error?`<div class="banner err" role="alert"><span style="color:var(--err);display:flex">${ico("circle-alert",24)}</span><div class="bt"><b>Could not load from GitHub</b><span class="m">${esc(S.error)}</span></div><button class="btn out" data-act="tab:settings">Check settings</button></div>`:""}${view}</div>${S.drawer?drawerHtml():""}`;
  window.scrollTo(0,y); paintPreview(); paintLi(); paintFan(); afterRender(); renderToast();
}
async function pickScreen(i){
  const inp = document.createElement("input"); inp.type="file"; inp.accept="image/png,image/jpeg,image/webp";
  inp.onchange = async () => { const f = inp.files[0]; if (!f) return; pullDrawerInputs(); const p = getPost(S.drawer.id);
    const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
    if (live()){ const path = `assets/${p.id}-${i+1}-${Date.now().toString(36)}.${f.type.includes("png")?"png":"jpg"}`; try { await gh.putFile(path, dataUrl.split(",")[1], `studio: screen for ${p.id}`); S.screens[path] = await (async()=>{ const im = new Image(); await new Promise(r=>{ im.onload=r; im.src=dataUrl; }); return im; })(); p.meta.slides[i].screen = path; } catch(e){ toast(e.message); return; } }
    else { p.meta.slides[i].screen = dataUrl; }
    render(); };
  inp.click();
}
document.addEventListener("input", e => { if (S.drawer && /^(d_cap|t_|b_|k_)/.test(e.target.id||"")){ pullDrawerInputs(); clearTimeout(window.__pv); window.__pv = setTimeout(paintPreview, 250); const cap = $("#d_cap"); if (cap && cap.nextElementSibling) cap.nextElementSibling.textContent = `${cap.value.length} / 2,200 characters`; } });
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return; const act = el.dataset.act; const [a, arg] = [act.split(":")[0], act.split(":").slice(1).join(":")];
  if (el.classList.contains("scrim") && e.target !== el) return;
  const d = S.drawer; const p = d && getPost(d.id);
  switch(a){
    case "tab": S._enter = true; S.tab = arg; lsSet("tab", arg); S.drawer = null; render(); window.scrollTo(0,0); break;
    case "reload": await loadAll(); break;
    case "f": S.fStatus = arg; render(); break;
    case "calf": S.calFilter = arg; render(); break;
    case "cal": if (arg==="0") S.calMonth = null; else { let {y,m} = S.calMonth; m += +arg; if (m<0){m=11;y--;} if (m>11){m=0;y++;} S.calMonth = {y,m}; } render(); break;
    case "open": S.drawer = { id:arg, slide:0 }; render(); break;
    case "closedrawer": if (el.classList.contains("scrim") || el.tagName==="BUTTON"){ pullDrawerInputs(); S.drawer = null; render(); } break;
    case "slide": { const n = (p.meta.slides||[]).length; if (n){ d.slide = (d.slide + (+arg) + n) % n; render(); } break; }
    case "pick": if (!/BUTTON|SELECT|INPUT|TEXTAREA|svg|path/i.test(e.target.tagName)){ pullDrawerInputs(); d.slide = +arg; render(); } break;
    case "addslide": pullDrawerInputs(); p.meta.slides.splice(Math.max(0,p.meta.slides.length-1), 0, {kind:"content", title:"New slide", body:""}); d.slide = Math.max(0,p.meta.slides.length-2); render(); break;
    case "del": pullDrawerInputs(); p.meta.slides.splice(+arg,1); d.slide = 0; render(); break;
    case "up": case "dn": { pullDrawerInputs(); const i = +arg, j = a==="up"?i-1:i+1, s = p.meta.slides; if (j>=0 && j<s.length){ [s[i],s[j]] = [s[j],s[i]]; d.slide = j; render(); } break; }
    case "shot": pickScreen(+arg); break;
    case "savedraft": { pullDrawerInputs(); const w = fromLocalInput($("#d_when").value); if (w) p.publish_at = w; try { await savePosts(`studio: edit ${p.id}`); toast("Draft saved."); } catch(err){ toast(err.message); } render(); break; }
    case "approve": case "approveagain": { pullDrawerInputs(); await approve(arg, fromLocalInput($("#d_when").value)); break; }
    case "unapprove": pullDrawerInputs(); await unapprove(arg); break;
    case "rm": if (el.dataset.confirm){ await removePost(arg); } else { el.dataset.confirm="1"; el.textContent="Click again to delete"; } break;
    case "gen": await generate(arg); break;
    case "genall": for (const q of S.posts.filter(x=>stage(x)==="planned")) await generate(q.id); break;
    case "retry": await retry(arg); break;
    case "now": await publishNow(arg); break;
    case "runpub": await runPublisher(); break;
    case "addrow": case "addgen": {
      const row = { pillar:$("#c_pillar").value.trim(), topic:$("#c_topic").value.trim(), hook:$("#c_hook").value.trim(), direction:$("#c_dir").value.trim(), cta:$("#c_cta").value.trim() };
      if (!row.topic){ toast("Add a topic first."); break; }
      try { await addRows([row]); const id = S.posts[S.posts.length-1].id; S.createDraft = null; if (a==="addgen"){ S.tab="approvals"; render(); await generate(id); S.drawer = {id, slide:0}; render(); } else { toast("Added to the queue."); S.tab="approvals"; render(); } } catch(err){ toast(err.message); }
      break; }
    case "import": { const rows = parseSheet($("#c_paste").value); if (!rows.length){ toast("No rows found. Check the column order."); break; } try { await addRows(rows); const need = rows.filter(r=>!(r.slides&&r.slides.length)).length; toast(need ? `${rows.length} row${rows.length>1?"s":""} added. Generating ${need} draft${need>1?"s":""}…` : `${rows.length} draft${rows.length>1?"s":""} added to Needs review.`); S.tab="approvals"; render(); if (need){ for (const q of S.posts.filter(x=>stage(x)==="planned")) await generate(q.id); toast("Generated. Review the drafts before approving."); } } catch(err){ toast(err.message); } break; }
    case "litype": liPull(); S.liDraft.type = arg; render(); break;
    case "liedit": { const q = getLi(arg); S.liDraft = { id:q.id, type:q.type, title:q.title||"", topic:q.meta?.topic||"", direction:q.meta?.direction||"", caption:q.caption||"", slidesTxt:slidesToTxt(q.meta?.slides), when:q.publish_at?toLocalInput(q.publish_at):"", sel:0 }; render(); window.scrollTo(0,0); break; }
    case "linew": S.liDraft = liDefault(); render(); break;
    case "lisave": await liSaveDraft(); break;
    case "liapprove": await liApprove(); break;
    case "liunapprove": liPull(); await liUnapprove(arg); break;
    case "liai": await liAi(); break;
    case "lislide": { liPull(); const n = txtToSlides(S.liDraft.slidesTxt).length; if (n){ S.liDraft.sel = ((S.liDraft.sel||0) + (+arg) + n) % n; render(); } break; }
    case "lipdf": { liPull(); const sl = txtToSlides(S.liDraft.slidesTxt); toast("Building PDF…"); const blob = await renderPdf(sl, S.liDraft.topic || S.liDraft.title); const a2 = document.createElement("a"); a2.href = URL.createObjectURL(blob); a2.download = (slug(S.liDraft.title||S.liDraft.topic)||"carousel")+".pdf"; a2.click(); break; }
    case "lifile": { liPull(); const inp = document.createElement("input"); inp.type="file"; inp.accept="video/mp4"; inp.onchange = () => { const f = inp.files[0]; if (!f) return; if (f.size > 60*1048576){ toast("That file is over 60 MB. Compress it first."); return; } const id = S.liDraft.id || (S.liDraft.id = slug(S.liDraft.title||S.liDraft.topic||"video")+"-"+Math.random().toString(36).slice(2,6)); S.liFiles[id] = f; render(); }; inp.click(); break; }
    case "lirm": if (el.dataset.confirm){ await liRemove(arg); } else { el.dataset.confirm="1"; el.textContent="Delete?"; } break;
    case "liretry": await liRetry(arg); break;
    case "linow": await liNow(arg); break;
    case "lirun": await runLiPublisher(); break;
    case "saveconn": { Object.assign(S.cfg, { owner:$("#s_owner").value.trim(), repo:$("#s_repo").value.trim(), branch:$("#s_branch").value.trim()||"main", token:$("#s_token").value.trim() }); lsSet("cfg", S.cfg); await loadAll(); if (!S.error) toast(live()?"Connected.":"Using sample data."); break; }
    case "testconn": { Object.assign(S.cfg, { owner:$("#s_owner").value.trim(), repo:$("#s_repo").value.trim(), branch:$("#s_branch").value.trim()||"main", token:$("#s_token").value.trim() }); try { const r = await gh.req(""); const f = await gh.getFile("schedule.json"); toast(`Connected to ${r.full_name}. schedule.json ${f?"found":"not found, it will be created"}.`); } catch(err){ toast(err.message); } break; }
    case "disconnect": S.cfg.token = ""; lsSet("cfg", S.cfg); await loadAll(); break;
    case "savewrite": Object.assign(S.cfg, { aiKey:$("#s_ai").value.trim(), aiModel:$("#s_model").value.trim()||"claude-sonnet-5-5", defaultTime:$("#s_time").value.trim()||"11:00", defaultCta:$("#s_cta").value, defaultTags:$("#s_tags").value, banned:$("#s_ban").value, notes:$("#s_notes").value }); lsSet("cfg", S.cfg); toast("Saved in this browser."); render(); break;
  }
});
document.addEventListener("input", e => { if (S.tab==="linkedin" && S.liDraft && /^l_/.test(e.target.id||"")){ liPull(); liLive(); if (e.target.id==="l_cap"){ const c = $("#l_cnt"); if (c) c.textContent = `${S.liDraft.caption.length} / 3,000 characters`; } if (e.target.id==="l_slides"){ clearTimeout(window.__lpv); window.__lpv = setTimeout(paintLi, 250); } } });
document.addEventListener("keydown", e => { if (e.key==="Escape" && S.drawer){ pullDrawerInputs(); S.drawer = null; render(); } });
S._enter = true;
loadAll();
</script>
</body></html>
