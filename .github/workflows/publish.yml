name: publish-instagram
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Publish loop (checks every minute for about 5h35m)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: |
          git config user.name "ig-publisher"
          git config user.email "ig-publisher@users.noreply.github.com"
          END=$((SECONDS+20100))
          while [ $SECONDS -lt $END ]; do
            git pull --rebase -X theirs origin main || git rebase --abort || true
            node publish.js || true
            if ! git diff --quiet schedule.json; then
              git add schedule.json
              git commit -m "update post status"
              for i in 1 2 3 4 5 6; do
                if git pull --rebase -X theirs origin main && git push origin HEAD:main; then break; fi
                git rebase --abort 2>/dev/null || true
                sleep 5
              done
            fi
            sleep 60
          done
      - name: Start the next loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
