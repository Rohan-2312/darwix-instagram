name: publish-linkedin
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: publish-linkedin
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish due approved LinkedIn posts
        env:
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_ORG_ID: '75131201'
        run: |
          if [ ! -f linkedin.json ]; then echo "No linkedin.json yet"; exit 0; fi
          node publish-linkedin.js
      - name: Save status
        if: always()
        run: |
          git config user.name "darwix-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add linkedin.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "linkedin: publish status [skip ci]" && git pull --rebase && git push)
