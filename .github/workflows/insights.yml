name: sync-insights
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: insights
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Pull insights
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node insights.js
      - name: Save
        run: |
          git config user.name "ig-publisher"
          git config user.email "ig-publisher@users.noreply.github.com"
          git add insights.json
          git diff --cached --quiet || (git commit -m "update insights" && git push)
